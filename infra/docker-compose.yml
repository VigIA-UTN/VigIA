version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: vigia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia_user
      POSTGRES_PASSWORD: vigia_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vigia_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  ml-celo:
    build: ../ml-celo
    container_name: vigia-ml-celo
    ports:
      - "8001:8001"

  ml-salud:
    build: ../ml-salud
    container_name: vigia-ml-salud
    ports:
      - "8002:8002"

  ml-geo:
    build: ../ml-geo
    container_name: vigia-ml-geo
    ports:
      - "8003:8003"

volumes:
  vigia_pgdata:

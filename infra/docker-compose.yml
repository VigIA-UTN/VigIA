services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: vigia-db
    restart: unless-stopped
    command: [ "postgres", "-c", "listen_addresses=*" ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
      POSTGRES_USER: ${POSTGRES_USER:-vigia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigia_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - vigia_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  backend-api:
    build:
      context: ../backend
      target: api
    container_name: vigia-backend-api
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-vigia}
      - DB_USER=${POSTGRES_USER:-vigia_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-vigia_dev_password}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      - db
      - rabbitmq

  backend-worker:
    build:
      context: ../backend
      target: worker
    container_name: vigia-backend-worker
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-vigia}
      - DB_USER=${POSTGRES_USER:-vigia_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-vigia_dev_password}
      - ML_CELO_URL=http://ml-celo:8001
      - ML_SALUD_URL=http://ml-salud:8002
      - ML_GEO_URL=http://ml-geo:8003
      - SPRING_RABBITMQ_HOST=rabbitmq
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      - db
      - ml-celo
      - ml-salud
      - ml-geo
      - rabbitmq
      - backend-api
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 15

  ml-celo:
    build: ../ml-celo
    container_name: vigia-ml-celo
    ports:
      - "${ML_CELO_PORT:-8001}:8001"
    volumes:
      - ../ml-celo/app:/app/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload" ]

  ml-salud:
    build: ../ml-salud
    container_name: vigia-ml-salud
    ports:
      - "${ML_SALUD_PORT:-8002}:8002"
    volumes:
      - ../ml-salud/app:/app/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload" ]

  ml-geo:
    build: ../ml-geo
    container_name: vigia-ml-geo
    ports:
      - "${ML_GEO_PORT:-8003}:8003"
    volumes:
      - ../ml-geo/app:/app/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload" ]

  simulador:
    build: ../simulador
    container_name: vigia-simulador
    environment:
      - API_URL=http://backend-worker:8081/api/v1/ingesta/uplink
      - NUM_ANIMALES=5
      - INTERVALO_SEGUNDOS=5
    depends_on:
      backend-worker:
        condition: service_healthy

  mail:
    image: axllent/mailpit
    container_name: vigia-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vigia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  vigia_pgdata:

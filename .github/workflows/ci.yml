name: VigIA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven (Local act only)
        if: ${{ github.actor == 'nektos/act' }}
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build and test with Maven
        run: mvn -B clean verify --file pom.xml

  ml-checks:
    name: ML Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-celo, ml-geo, ml-salud, ml-training]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Syntax check
        run: |
          python -m compileall .

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests found."
          fi

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, ml-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build all Docker Compose services
        run: docker compose -f infra/docker-compose.yml build

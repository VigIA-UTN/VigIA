name: VigIA CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Test
        run: npm test -- --coverage
        
      - name: Build
        run: npm run build

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven (Local act only)
        if: ${{ github.actor == 'nektos/act' }}
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build and test with Maven
        run: mvn -B clean verify --file pom.xml

      # upload-artifact no usa el working-directory: los paths van desde la raíz del repo
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            backend/*/target/site/jacoco/
            backend/backend-coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  ml-checks:
    name: ML Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-celo, ml-geo, ml-salud, ml-training]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Syntax check
        run: |
          python -m compileall .

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --cov --cov-report=term --cov-report=xml --cov-report=html
          else
            echo "No tests found."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/htmlcov/
          if-no-files-found: ignore

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, ml-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build all Docker Compose services
        run: docker compose -f infra/docker-compose.yml build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, ml-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers and dependencies
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start Docker Compose stack
        run: docker compose -f infra/docker-compose.yml up -d --build --wait

      - name: Wait for Backend API readiness
        run: |
          echo "Waiting for vigia-backend-api to be UP..."
          for i in {1..30}; do
            STATUS=$(curl -s http://localhost:8080/actuator/health | grep '"status":"UP"' || true)
            if [ -n "$STATUS" ]; then
              echo "Backend is UP!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, sleeping 2s..."
            sleep 2
          done

      - name: Load scenario fixtures
        run: |
          cat fixtures/escenario/limpiar.sql fixtures/escenario/escenario.sql | docker exec -i vigia-db psql -U vigia_user -d vigia -v ON_ERROR_STOP=1

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100

      - name: Upload Playwright HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

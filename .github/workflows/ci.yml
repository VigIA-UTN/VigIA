name: VigIA CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vigia_user
          POSTGRES_PASSWORD: vigia_dev_password
          POSTGRES_DB: vigia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven (Local act only)
        if: ${{ github.actor == 'nektos/act' }}
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

  ml-checks:
    name: ML Services Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-celo, ml-geo, ml-salud]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Syntax check
        run: |
          python -m compileall .

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    # Wait for the other jobs to succeed before testing the full docker build
    needs: [frontend-build, backend-build, ml-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build all Docker Compose services
        run: docker compose -f infra/docker-compose.yml build

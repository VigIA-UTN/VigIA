spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# URLs internas de los microservicios ML (red privada / VPC en producción,
# localhost durante el desarrollo)
vigia:
  ml:
    celo-url: ${ML_CELO_URL:http://localhost:8001}
    salud-url: ${ML_SALUD_URL:http://localhost:8002}
    geo-url: ${ML_GEO_URL:http://localhost:8003}

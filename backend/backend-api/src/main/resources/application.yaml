spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:422492479676-4g5t9nkp7fe5p7na244dfr4mjtmabm38.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
              - openid
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

vigia:
  ml:
    celo-url: ${ML_CELO_URL}
    salud-url: ${ML_SALUD_URL}
    geo-url: ${ML_GEO_URL}

cors:
  allowed-origins: ${CORS_ORIGINS}

resilience4j:
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
  timelimiter:
    instances:
      celoML:
        timeoutDuration: 2000ms

app:
  frontend-url: ${FRONTEND_URL}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:422492479676-4g5t9nkp7fe5p7na244dfr4mjtmabm38.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
              - openid
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
    hikari:
      # Loguea el stack de quien retenga una conexión más de 20 s. Solo diagnóstico.
      leak-detection-threshold: 20000
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    # Sin Open Session in View: la sesión (y su conexión) dura lo que la transacción del service, no todo
    # el request. Con OSIV, cada stream SSE abierto retenía una conexión hasta 30 min y agotaba el pool.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

vigia:
  ml:
    celo-url: ${ML_CELO_URL:http://localhost:8001}
    salud-url: ${ML_SALUD_URL:http://localhost:8002}
    geo-url: ${ML_GEO_URL:http://localhost:8003}
  celo:
    horas-dato-desactualizado: ${CELO_HORAS_DATO_DESACTUALIZADO:2}
  geo:
    # Misma ventana que analiza el worker: rotula el tiempo acumulado fuera del grupo en el detalle.
    ventana-horas: ${VIGIA_GEO_VENTANA_HORAS:24}

cors:
  allowed-origins: ${CORS_ORIGINS}

resilience4j:
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
      geoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
      geoML:
        maxAttempts: 2
        waitDuration: 500ms
  timelimiter:
    instances:
      celoML:
        timeoutDuration: 2000ms

app:
  frontend-url: ${FRONTEND_URL}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  mail:
    logo-url: ${MAIL_LOGO_URL:https://lh3.googleusercontent.com/d/1Xc2wYPMidzyNZEoA9zGhSlOr1lzOwCZ4}

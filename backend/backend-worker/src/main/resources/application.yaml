spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
  batch:
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081

vigia:
  ml:
    celo-url: ${ML_CELO_URL:http://localhost:8001}
    salud-url: ${ML_SALUD_URL:http://localhost:8002}
    geo-url: ${ML_GEO_URL:http://localhost:8003}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

resilience4j:
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
  timelimiter:
    instances:
      celoML:
        timeoutDuration: 2000ms


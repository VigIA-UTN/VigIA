spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
    driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  task:
    scheduling:
      pool:
        # Un hilo por tarea programada (celo, salud, geo, anestro, archivador): con uno solo, una corrida larga
        # frenaba a las demás. Una misma tarea nunca corre dos veces a la vez, y celo, salud y geo corren de a uno
        # entre sí (ver BatchScheduler).
        size: 5
  jpa:
    # Sin Open Session in View: el webhook de TTN retendría la conexión durante todo el request, también
    # mientras publica en RabbitMQ; si el broker se traba, esas esperas agotan el pool (como pasó en la API).
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8081}

vigia:
  ml:
    celo-url: ${ML_CELO_URL}
    salud-url: ${ML_SALUD_URL}
    geo-url: ${ML_GEO_URL}
    # Timeout de lectura de cada llamada. Medido con la CPU limitada a 0,5 vCPU, el p95 fue de ~800 ms en celo y de
    # ~200 ms en salud. Geo recibe las posiciones de todo el rodeo y su tiempo crece con el tamaño del establecimiento.
    celo-timeout-ms: ${VIGIA_ML_CELO_TIMEOUT_MS:2000}
    salud-timeout-ms: ${VIGIA_ML_SALUD_TIMEOUT_MS:4000}
    geo-timeout-ms: ${VIGIA_ML_GEO_TIMEOUT_MS:10000}
  batch:
    celo-rate: ${VIGIA_BATCH_CELO_RATE:60000}
    salud-rate: ${VIGIA_BATCH_SALUD_RATE:60000}
    geo-rate: ${VIGIA_BATCH_GEO_RATE:900000}
    # Detector de anestro (cron de Spring: seg min hora día mes día-semana), en hora argentina. Por defecto a las
    # 2 AM: es lo que corre en Railway, que no define la variable.
    anestro-cron: "${VIGIA_BATCH_ANESTRO_CRON:0 0 2 * * *}"
    anestro-silencio-dias: ${VIGIA_BATCH_ANESTRO_SILENCIO_DIAS:21}
  geo:
    # Ventana de posiciones (en horas) que se envía a ml-geo en cada análisis.
    ventana-horas: ${VIGIA_GEO_VENTANA_HORAS:24}
    # Minutos seguidos fuera del grupo antes de abrir un aislamiento (filtra GPS errático y salidas cortas).
    minutos-fuera-minimo: ${VIGIA_GEO_MINUTOS_FUERA_MINIMO:15}
    # Horas sin telemetría tras las que se cierra un aislamiento abierto como "sin datos".
    horas-sin-datos-cierre: ${VIGIA_GEO_HORAS_SIN_DATOS_CIERRE:6}
  celo:
    # Mismo criterio que salud para las ventanas con uplinks perdidos (ver VentanaTelemetria.puntosParaMl).
    cobertura-minima: ${VIGIA_CELO_COBERTURA_MINIMA:0.9}
    hueco-maximo-minutos: ${VIGIA_CELO_HUECO_MAXIMO_MINUTOS:60}
  salud:
    calibracion-dias: ${VIGIA_SALUD_CALIBRACION_DIAS:7}
    recalibracion-dias: ${VIGIA_SALUD_RECALIBRACION_DIAS:30}
    # Ventanas con uplinks perdidos: fracción mínima de los slots de 5 min con una lectura real, y el hueco
    # más largo que se rellena (ver VentanaTelemetria.puntosParaMl).
    cobertura-minima: ${VIGIA_SALUD_COBERTURA_MINIMA:0.9}
    hueco-maximo-minutos: ${VIGIA_SALUD_HUECO_MAXIMO_MINUTOS:60}
  ttn:
    webhook:
      api-key: ${TTN_WEBHOOK_API_KEY:apiKey}

resilience4j:
  # Un 4xx (p. ej. 422 por datos insuficientes) es una respuesta del servicio, no una
  # caída: no se reintenta ni cuenta para abrir el circuito.
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      saludML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      geoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
  # Un solo reintento, y solo ante fallas pasajeras: 503, 504, timeout o servicio inalcanzable (ver FallaTransitoriaMl).
  # Un 500 o un 4xx darían lo mismo al repetirlos, y con el circuito abierto repetir solo suma la espera. Todo lo que
  # no se reintenta va directo al fallback.
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptionPredicate: dev.vigia.backend.client.FallaTransitoriaMl
      saludML:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptionPredicate: dev.vigia.backend.client.FallaTransitoriaMl
      geoML:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptionPredicate: dev.vigia.backend.client.FallaTransitoriaMl

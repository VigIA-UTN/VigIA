spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
    driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  jpa:
    # Sin Open Session in View: el webhook de TTN retendría la conexión durante todo el request, también
    # mientras publica en RabbitMQ; si el broker se traba, esas esperas agotan el pool (como pasó en la API).
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8081}

vigia:
  ml:
    celo-url: ${ML_CELO_URL}
    salud-url: ${ML_SALUD_URL}
    geo-url: ${ML_GEO_URL}
  batch:
    celo-rate: ${VIGIA_BATCH_CELO_RATE:60000}
    salud-rate: ${VIGIA_BATCH_SALUD_RATE:60000}
    geo-rate: ${VIGIA_BATCH_GEO_RATE:900000}
    # Detector de anestro (cron de Spring: seg min hora día mes día-semana).
    anestro-cron: "${VIGIA_BATCH_ANESTRO_CRON:0 * * * * *}"
    anestro-silencio-dias: ${VIGIA_BATCH_ANESTRO_SILENCIO_DIAS:21}
  geo:
    # Ventana de posiciones (en horas) que se envía a ml-geo en cada análisis.
    ventana-horas: ${VIGIA_GEO_VENTANA_HORAS:24}
    # Minutos seguidos fuera del grupo antes de abrir un aislamiento (filtra GPS errático y salidas cortas).
    minutos-fuera-minimo: ${VIGIA_GEO_MINUTOS_FUERA_MINIMO:15}
    # Horas sin telemetría tras las que se cierra un aislamiento abierto como "sin datos".
    horas-sin-datos-cierre: ${VIGIA_GEO_HORAS_SIN_DATOS_CIERRE:6}
  salud:
    calibracion-dias: ${VIGIA_SALUD_CALIBRACION_DIAS:7}
    recalibracion-dias: ${VIGIA_SALUD_RECALIBRACION_DIAS:30}
  ttn:
    webhook:
      api-key: ${TTN_WEBHOOK_API_KEY:apiKey}

cors:
  allowed-origins: ${CORS_ORIGINS}

resilience4j:
  # Un 4xx (p. ej. 422 por datos insuficientes) es una respuesta del servicio, no una
  # caída: no se reintenta ni cuenta para abrir el circuito.
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      saludML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      geoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      saludML:
        maxAttempts: 2
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      geoML:
        maxAttempts: 2
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

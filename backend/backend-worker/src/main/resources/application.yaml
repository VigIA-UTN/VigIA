spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vigia}
    username: ${DB_USER:vigia_user}
    password: ${DB_PASSWORD:vigia_dev_password}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8081}

vigia:
  ml:
    celo-url: ${ML_CELO_URL}
    salud-url: ${ML_SALUD_URL}
    geo-url: ${ML_GEO_URL}
  batch:
    salud-rate: ${VIGIA_BATCH_SALUD_RATE:60000}
  salud:
    calibracion-dias: ${VIGIA_SALUD_CALIBRACION_DIAS:7}
    recalibracion-dias: ${VIGIA_SALUD_RECALIBRACION_DIAS:30}

cors:
  allowed-origins: ${CORS_ORIGINS}

resilience4j:
  circuitbreaker:
    instances:
      celoML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
      saludML:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      celoML:
        maxAttempts: 2
        waitDuration: 500ms
      saludML:
        maxAttempts: 2
        waitDuration: 500ms
  timelimiter:
    instances:
      celoML:
        timeoutDuration: 2000ms
      # saludML puede hacer DOS llamadas HTTP en un mismo ciclo (perfil
      # + predict) cuando toca calcular/recalibrar el perfil, así que se
      # le da más margen que a celoML (que siempre hace una sola).
      saludML:
        timeoutDuration: 4000ms

